font: "JetBrainsMono Nerd Font 12"
background: "#282828e0"
color: "#ebdbb2"
border: "#98971a"
separator: "  "
border_width: 2
corner_r: 4
padding: 16
anchor: center
auto_kbd_layout: true
inhibit_compositor_keyboard_shortcuts: true

menu:
  - key: "o"
    desc: "  open"
    submenu:
      - key: "t"
        desc: "  terminal"
        cmd: kitty
      - key: "b"
        desc: "  browser"
        cmd: firefox
      - key: "m"
        desc: "  mail"
        cmd: thunderbird
      - key: "f"
        desc: "  files"
        cmd: kitty yazi
      - key: "d"
        desc: "  displays"
        cmd: nwg-displays
      - key: "v"
        desc: "  volume"
        cmd: pavucontrol
      - key: "n"
        desc: "  network"
        cmd: nm-connection-editor
      - key: "B"
        desc: "  bluetooth"
        cmd: blueman-manager

  - key: "w"
    desc: "  window"
    submenu:
      - key: "q"
        desc: "  close"
        cmd: "hyprctl dispatch 'hl.dsp.window.close()'"
      - key: "f"
        desc: "  fullscreen"
        cmd: "hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = \"fullscreen\", action = \"toggle\" })'"
      - key: "m"
        desc: "  maximize"
        cmd: "hyprctl dispatch 'hl.dsp.window.fullscreen({ mode = \"maximized\", action = \"toggle\" })'"
      - key: "t"
        desc: "  float"
        cmd: "hyprctl dispatch 'hl.dsp.window.float({ action = \"toggle\" })'"
      - key: "c"
        desc: "  move to empty"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = \"empty\" })'"

  - key: "f"
    desc: "  focus"
    submenu:
      - key: "h"
        desc: "  right"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ direction = \"right\" })'"
        keep_open: true
      - key: "l"
        desc: "  left"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ direction = \"left\" })'"
        keep_open: true
      - key: "k"
        desc: "  up"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ direction = \"up\" })'"
        keep_open: true
      - key: "j"
        desc: "  down"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ direction = \"down\" })'"
        keep_open: true

  - key: "m"
    desc: "  move window"
    submenu:
      - key: "h"
        desc: "  right"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ direction = \"right\" })'"
        keep_open: true
      - key: "l"
        desc: "  left"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ direction = \"left\" })'"
        keep_open: true
      - key: "k"
        desc: "  up"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ direction = \"up\" })'"
        keep_open: true
      - key: "j"
        desc: "  down"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ direction = \"down\" })'"
        keep_open: true

  - key: "M"
    desc: "  move (pixel)"
    submenu:
      - key: "h"
        desc: "  right"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ x = 80, y = 0, relative = true })'"
        keep_open: true
      - key: "l"
        desc: "  left"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ x = -80, y = 0, relative = true })'"
        keep_open: true
      - key: "k"
        desc: "  up"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ x = 0, y = -80, relative = true })'"
        keep_open: true
      - key: "j"
        desc: "  down"
        cmd: "hyprctl dispatch 'hl.dsp.window.move({ x = 0, y = 80, relative = true })'"
        keep_open: true

  - key: "r"
    desc: "  resize"
    submenu:
      - key: "h"
        desc: "  right +"
        cmd: "hyprctl dispatch 'hl.dsp.window.resize({ x = 80, y = 0, relative = true })'"
        keep_open: true
      - key: "l"
        desc: "  left +"
        cmd: "hyprctl dispatch 'hl.dsp.window.resize({ x = -80, y = 0, relative = true })'"
        keep_open: true
      - key: "k"
        desc: "  up"
        cmd: "hyprctl dispatch 'hl.dsp.window.resize({ x = 0, y = -80, relative = true })'"
        keep_open: true
      - key: "j"
        desc: "  down"
        cmd: "hyprctl dispatch 'hl.dsp.window.resize({ x = 0, y = 80, relative = true })'"
        keep_open: true

  - key: "W"
    desc: "  workspace"
    submenu:
      - key: "1"
        desc: "  go to 1"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 1 })'"
      - key: "2"
        desc: "  go to 2"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 2 })'"
      - key: "3"
        desc: "  go to 3"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 3 })'"
      - key: "4"
        desc: "  go to 4"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 4 })'"
      - key: "5"
        desc: "  go to 5"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 5 })'"
      - key: "6"
        desc: "  go to 6"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 6 })'"
      - key: "7"
        desc: "  go to 7"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 7 })'"
      - key: "8"
        desc: "  go to 8"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 8 })'"
      - key: "9"
        desc: "  go to 9"
        cmd: "hyprctl dispatch 'hl.dsp.focus({ workspace = 9 })'"
      - key: "m"
        desc: "  move window to"
        submenu:
          - key: "1"
            desc: "  ws 1"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 1, follow = false })'"
          - key: "2"
            desc: "  ws 2"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 2, follow = false })'"
          - key: "3"
            desc: "  ws 3"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 3, follow = false })'"
          - key: "4"
            desc: "  ws 4"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 4, follow = false })'"
          - key: "5"
            desc: "  ws 5"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 5, follow = false })'"
          - key: "6"
            desc: "  ws 6"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 6, follow = false })'"
          - key: "7"
            desc: "  ws 7"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 7, follow = false })'"
          - key: "8"
            desc: "  ws 8"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 8, follow = false })'"
          - key: "9"
            desc: "  ws 9"
            cmd: "hyprctl dispatch 'hl.dsp.window.move({ workspace = 9, follow = false })'"

  - key: "v"
    desc: "  volume"
    submenu:
      - key: "k"
        desc: "  up +2"
        cmd: pamixer -i 2
        keep_open: true
      - key: "j"
        desc: "  down -2"
        cmd: pamixer -d 2
        keep_open: true
      - key: "m"
        desc: "  mute"
        cmd: pamixer -t
      - key: "p"
        desc: "  pavucontrol"
        cmd: pavucontrol

  - key: "b"
    desc: "  brightness"
    submenu:
      - key: "k"
        desc: "  up +5"
        cmd: brightnessctl set 5%+
        keep_open: true
      - key: "j"
        desc: "  down -5"
        cmd: brightnessctl set 5%-
        keep_open: true

  - key: "s"
    desc: "  screenshot"
    submenu:
      - key: "s"
        desc: "  area → clip"
        cmd: grimblast --freeze copy area
      - key: "S"
        desc: "  full → clip"
        cmd: grimblast copy screen
      - key: "f"
        desc: "  full → file"
        cmd: grimblast save screen

  - key: "n"
    desc: "  notifications"
    cmd: swaync-client -t -sw

  - key: "c"
    desc: "  clipboard"
    cmd: "cliphist list | rofi -dmenu -theme-str 'window {width: 50%;} listview {columns: 1;}' | cliphist decode | wl-copy"

  - key: "q"
    desc: "  session"
    submenu:
      - key: "l"
        desc: "  lock"
        cmd: swaylock
      - key: "e"
        desc: "  exit"
        cmd: "hyprctl dispatch 'hl.dsp.exit()'"
      - key: "r"
        desc: "  reboot"
        cmd: systemctl reboot
      - key: "p"
        desc: "  poweroff"
        cmd: systemctl poweroff

  - key: "?"
    desc: "  help / shortcuts"
    submenu:
      - key: "n"
        desc: "  navigation: h right · j down · k up · l left"
        cmd: "notify-send 'Navigation' 'h right  ·  j down  ·  k up  ·  l left'"
      - key: "w"
        desc: "  windows: Super+hjkl focus · +Shift move · +Ctrl resize"
        cmd: "notify-send 'Window shortcuts' 'Super+hjkl focus\nSuper+Shift+hjkl move\nSuper+Ctrl+hjkl resize'"
      - key: "a"
        desc: "  apps: Super+Return terminal · Super+d launcher"
        cmd: "notify-send 'Application shortcuts' 'Super+Return terminal\nSuper+d launcher\nSuper+n notifications'"
      - key: "k"
        desc: "  Kitty: Alt+hjkl focus split · Alt+Shift+h/l resize"
        cmd: "notify-send 'Kitty shortcuts' 'Alt+hjkl focus split\nAlt+Shift+h/l resize\nAlt+a open Codex split'"
      - key: "y"
        desc: "  Yazi: ? built-in help · h enter · l leave"
        cmd: "notify-send 'Yazi shortcuts' '? built-in help\nh enter directory · l leave directory\nCtrl+n drag selection'"
      - key: "f"
        desc: "  Firefox: Surfingkeys h/j/k/l · ? built-in help"
        cmd: "notify-send 'Firefox shortcuts' 'Surfingkeys: h right · j down · k up · l left\n? opens its complete shortcut guide'"
      - key: "e"
        desc: "  editors: Space opens command groups"
        cmd: "notify-send 'Editor shortcuts' 'Space opens command groups; ? opens command help.'"
