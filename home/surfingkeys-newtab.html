<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root {
    color-scheme: dark;
    font-family: "Maple Mono", monospace;
    background: #1d2021;
    color: #ebdbb2;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #1d2021;
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  main {
    text-align: center;
    opacity: .9;
  }
  h1 {
    margin: 0 0 .75rem;
    font-size: 1.25rem;
    font-weight: 500;
    color: #b8bb26;
  }
  p {
    margin: 0;
    color: #a89984;
    font-size: .9rem;
  }
</style>
</head>
<body tabindex="-1">
<main>
  <h1>New Tab</h1>
  <p>t search · f follow · T tabs · ? help</p>
</main>
<script>
  // New Tab Override asks Firefox to focus the website; reinforce that once
  // the local page itself is ready so keyboard input goes to page extensions.
  window.addEventListener("load", function () {
    window.focus();
    document.body.focus({ preventScroll: true });
    setTimeout(function () {
      window.focus();
      document.body.focus({ preventScroll: true });
    }, 100);
  });
</script>
</body>
</html>
