(defsrc
esc
q w e r t y u i o p bspc
caps a s d f g h j k l ;
z x c v b n m , . /
lsft rsft
lctl rctl lalt ralt lmet rmet
)

(deflayer qwerty
@cn
q w e r t y u i o p esc
bspc a s d f g h j k l ;
z x c v b n m , . /
lsft rsft
@qlc @qrc @qla @qra @qlm @qrm
)

(deflayer canary
@qw
w l y p k z x o u ; esc
bspc c r s t b f n e i a
j v d g q m h / , .
@ls @rs
@clc @crc @cla @cra @clm @crm
)

;; Touch-typing Shift discipline applies only to ordinary Canary typing:
;; - Left Shift may shift only right-hand letter/punctuation positions.
;; - Right Shift may shift only left-hand letter positions.
;; - Ctrl, Alt, or Meta/Super switch to a shortcut layer that preserves the
;;   active logical layout but bypasses these Shift restrictions.
;; A same-hand Shift+typing-key is deliberately swallowed only while typing.
(deflayer left-shift
_
XX XX XX XX XX _ _ _ _ _ _
_ XX XX XX XX XX _ _ _ _ _
XX XX XX XX XX _ _ _ _ _
_ _
_ _ _ _ _ _
)

(deflayer right-shift
_
_ _ _ _ _ XX XX XX XX XX _
_ _ _ _ _ _ XX XX XX XX XX
_ _ _ _ _ XX XX XX XX XX
_ _
_ _ _ _ _ _
)

;; Explicit shortcut layers sit above the Shift-discipline layers. This makes
;; Ctrl+Shift / Alt+Shift / Super+Shift unrestricted without changing what a
;; key means in the active typing layout. Crucially, the physical Caps key is
;; still Backspace here; no layer emits Caps Lock.
(deflayer qwerty-shortcut
esc
q w e r t y u i o p esc
bspc a s d f g h j k l ;
z x c v b n m , . /
lsft rsft
lctl rctl lalt ralt lmet rmet
)

(deflayer canary-shortcut
esc
w l y p k z x o u ; esc
bspc c r s t b f n e i a
j v d g q m h / , .
lsft rsft
lctl rctl lalt ralt lmet rmet
)

(defalias
cn (layer-switch canary)
qw (layer-switch qwerty)

ls (multi lsft (layer-while-held left-shift))
rs (multi rsft (layer-while-held right-shift))

qlc (multi lctl (layer-while-held qwerty-shortcut))
qrc (multi rctl (layer-while-held qwerty-shortcut))
qla (multi lalt (layer-while-held qwerty-shortcut))
qra (multi ralt (layer-while-held qwerty-shortcut))
qlm (multi lmet (layer-while-held qwerty-shortcut))
qrm (multi rmet (layer-while-held qwerty-shortcut))

clc (multi lctl (layer-while-held canary-shortcut))
crc (multi rctl (layer-while-held canary-shortcut))
cla (multi lalt (layer-while-held canary-shortcut))
cra (multi ralt (layer-while-held canary-shortcut))
clm (multi lmet (layer-while-held canary-shortcut))
crm (multi rmet (layer-while-held canary-shortcut))
)
