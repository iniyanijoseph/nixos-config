(defsrc
esc
q w e r t y u i o p bspc
caps a s d f g h j k l ;
z x c v b n m , . /
lsft rsft
lctl rctl lalt ralt lmet rmet
)

(deflayer qwerty
@cn
q w e r t y u i o p esc
bspc a s d f g h j k l ;
z x c v b n m , . /
lsft rsft
@lc @rc @la @ra @lm @rm
)

(deflayer canary
@qw
w l y p k z x o u ; esc
bspc c r s t b f n e i a
j v d g q m h / , .
@ls @rs
@lc @rc @la @ra @lm @rm
)

;; Touch-typing Shift discipline applies only to ordinary Canary typing:
;; - Left Shift may shift only right-hand letter/punctuation positions.
;; - Right Shift may shift only left-hand letter positions.
;; - Holding Ctrl, Alt, or Meta/Super temporarily bypasses this discipline, so
;;   shortcuts such as Ctrl+Shift+K, Alt+Shift+H, and Super+Shift+S work with
;;   either Shift key.
;; A same-hand Shift+typing-key is deliberately swallowed.
(deflayer left-shift
_
XX XX XX XX XX _ _ _ _ _ _
_ XX XX XX XX XX _ _ _ _ _
XX XX XX XX XX _ _ _ _ _
_ _
_ _ _ _ _ _
)

(deflayer right-shift
_
_ _ _ _ _ XX XX XX XX XX _
_ _ _ _ _ _ XX XX XX XX XX
_ _ _ _ _ XX XX XX XX XX
_ _
_ _ _ _ _ _
)

;; While any shortcut modifier is held, use the base layer directly rather
;; than either Shift-discipline layer. Shift itself is emitted raw here so
;; pressing Ctrl/Alt/Super before Shift also bypasses enforcement.
(deflayer shortcut
_
_ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _
lsft rsft
_ _ _ _ _ _
)

(defalias
cn (layer-switch canary)
qw (layer-switch qwerty)

ls (multi lsft (layer-while-held left-shift))
rs (multi rsft (layer-while-held right-shift))

lc (multi lctl (layer-while-held shortcut))
rc (multi rctl (layer-while-held shortcut))
la (multi lalt (layer-while-held shortcut))
ra (multi ralt (layer-while-held shortcut))
lm (multi lmet (layer-while-held shortcut))
rm (multi rmet (layer-while-held shortcut))
)
