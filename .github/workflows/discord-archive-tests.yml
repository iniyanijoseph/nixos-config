name: Discord archive tools

on:
  push:
    paths:
      - 'hosts/contabo/discord-archive/**'
      - '.github/workflows/discord-archive-tests.yml'
  workflow_dispatch:

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q hosts/contabo/discord-archive
      - name: Test archive recovery logic
        run: python3 -m unittest discover -s hosts/contabo/discord-archive -p 'test_*.py' -v
