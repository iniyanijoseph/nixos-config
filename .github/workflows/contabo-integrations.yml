name: Contabo integration builds
on:
  push:
    paths:
      - 'hosts/contabo/**'
      - '.github/workflows/contabo-integrations.yml'
  workflow_dispatch:
jobs:
  invitations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify single-use registration against a disposable Synapse
        run: nix build -L --no-link ./hosts/contabo#checks.x86_64-linux.contabo-admin-nixos-test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check the laptop launcher's loopback forwarding and cleanup
        run: python3 hosts/contabo/test_bridge_manager.py
      - name: Evaluate the fully enabled integration profile
        run: |
          nix eval --impure --raw --expr '
            let f=builtins.getFlake(toString ./hosts/contabo);
            in (f.nixosConfigurations.contabo.extendModules {modules=[
              ({lib,...}:{contabo.integrations.enable=lib.mkForce true;
                contabo.discordNative.enable=lib.mkForce true;
                contabo.mail.enable=lib.mkForce true;})
            ];}).config.system.build.toplevel.drvPath'
      - run: nix build -L --no-link ./hosts/contabo#checks.x86_64-linux.contabo-commission-tests ./hosts/contabo#checks.x86_64-linux.contabo-admin-tests ./hosts/contabo#contabo-discord-native ./hosts/contabo#contabo-finish-setup ./hosts/contabo#contabo-bridge-manager ./hosts/contabo#contabo-discord-login ./hosts/contabo#contabo-admin
  matrimail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Compile pinned Matrimail and verify configuration and registration
        run: |
          nix build -L --no-link ./hosts/contabo#contabo-matrimail
          export CONTABO_MATRIMAIL_BINARY="$(nix build --no-link --print-out-paths ./hosts/contabo#contabo-matrimail)/bin/matrimail"
          nix develop ./hosts/contabo#email-bridge --command python3 hosts/contabo/test_commission_integrations.py
      - name: Verify restrictive-umask installation as a separate service identity
        run: |
          nix develop ./hosts/contabo#email-bridge --command bash -c '
            exec sudo "$(command -v python3)" hosts/contabo/test_commission_integrations.py Tests.test_matrimail_executes_as_service_identity_after_repair'
